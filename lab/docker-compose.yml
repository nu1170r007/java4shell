# Java4Shell (CVE-2026-114938) Lab Environment
#
# Spins up a vulnerable Java service for PoC testing.
# REQUIRES: x86-64 host with AVX-512 VBMI (Intel Ice Lake+ / AMD Zen 4+)
# ARM64 hosts will NOT reproduce the vulnerability.
#
# Usage:
#   docker compose up -d
#   docker compose exec poc bash
#   java Base64Trigger

services:
  poc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java4shell-poc
    platform: linux/amd64
    stdin_open: true
    tty: true
    entrypoint: ["sleep", "infinity"]
    deploy:
      resources:
        limits:
          memory: 2g

  # Optional: vulnerable Keycloak instance for remote testing
  # Uncomment to test against a real Java application
