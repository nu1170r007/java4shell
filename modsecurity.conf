# Java4Shell (CVE-2026-114938) ModSecurity WAF Rules
#
# Drop-in for Apache mod_security or nginx + ModSecurity v3

# Rule 1: Block malformed Base64 in Basic Auth (single trailing =, non-standard length)
SecRule REQUEST_HEADERS:Authorization "@rx ^Basic\s+(?:[A-Za-z0-9+/]{4})*[A-Za-z0-9+/]{0,2}=$" \
    "id:2026114901,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Java4Shell: Malformed Base64 padding in Basic Auth (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',\
    tag:'attack/rce',\
    severity:'CRITICAL'"

# Rule 2: Block exact 64×A+= trigger pattern in any header
SecRule REQUEST_HEADERS "@contains AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
    "id:2026114902,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Java4Shell: Exact trigger pattern detected (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',\
    tag:'attack/rce',\
    severity:'CRITICAL'"

# Rule 3: Block exact 128×A+= trigger pattern (JDK 17)
SecRule REQUEST_HEADERS "@contains AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
    "id:2026114903,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Java4Shell: Exact trigger pattern for JDK17 detected (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',\
    tag:'attack/rce',\
    severity:'CRITICAL'"

# Rule 4: Block malformed Base64 in request body (file uploads, API payloads)
SecRule REQUEST_BODY "@rx (?:[A-Za-z0-9+/]{64,})={1}(?:[^=]|$)" \
    "id:2026114904,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Java4Shell: Malformed Base64 padding in request body (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',\
    tag:'attack/rce',\
    severity:'HIGH'"

# Rule 5: Rate limit — high frequency Base64 auth (warm-up detection)
SecRule REQUEST_HEADERS:Authorization "@beginsWith Basic " \
    "id:2026114905,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'ip.java4shell_auth_count=+1',\
    expirevar:'ip.java4shell_auth_count=60'"

SecRule IP:JAVA4SHELL_AUTH_COUNT "@gt 500" \
    "id:2026114906,\
    phase:1,\
    deny,\
    status:429,\
    log,\
    msg:'Java4Shell: Potential JIT warm-up detected - high rate Base64 auth (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',\
    severity:'MEDIUM'"
